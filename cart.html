<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Cart Sharing App</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">   
</head>
<body>
<section>
    <div class="container mb-5">
        <div class="row">
            <div class="col-md-12">
                <h2>Shared Cart</h2>
                <p>Welcome,
                    <span id="userMobile"></span>
                </p>
                <form>
                    <div class="product-form">

                        <div class="form-field">
                        <label for="product" class="form-label">
                            Product
                        </label>

                        <input 
                        type="text" 
                        class="form-control" 
                        id="product" 
                        placeholder="Enter product name">
                        </div>
                        
                        <div class="form-field">
                        <label for="quantity" class="form-label">
                            Quantity
                        </label>

                        <input
                        type="number"
                        class="form-control"
                        id="quantity"
                        placeholder="Enter quantity"
                        min="1"
                        >
                        </div>

                         <div class="form-field">
                        <label for="price" class="form-label">
                            Price
                        </label>
                        <input
                        type="number"
                        class="form-control"
                        id="price"
                        placeholder="Enter price"
                        min="0"
                        step="0.01"
                        >
                        </div>

                        <div class="form-button">
                        <button type="button"  
                        id="addProductBtn"
                        class="btn btn-success mt-3">
                        Add Product</button>
                        </div>

                    </div>
                </form> 

                <div id="notification" class="alert d-none" role="alert"></div>
             
                <div class="card-table-wrapper">
                 <table class="table table-bordered mt-4">
                    <thead>
                        <tr>
                            <th>Product</th>
                            <th>Quantity</th>
                            <th>Price</th>
                            <th>Total</th>
                            <th>Added By</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="productList"></tbody>
                 </table>
               </div>
      
               <div class="text-end mt-3">
                <button
                type="button"
                id="printBtn"
                class="btn btn-dark">
                Print Products
               </button>
               </div>
           
            </div>
        </div>
    </div>
</section>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const loggedInMobile = localStorage.getItem("mobileNumber");
    if(loggedInMobile){
         document.getElementById("userMobile").innerText = loggedInMobile;
        
    }else{
        alert("Please login first.");
        window.location.href = "index.html";
    }
</script>
<script src="js/cart.js"></script>
</body>
</html>
